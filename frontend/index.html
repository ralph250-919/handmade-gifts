<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Handmade Gifts</title>
  <meta name="description" content="Hand-created gifts, made with care in small batches.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Handmade Gifts">
  <meta property="og:description" content="Hand-created gifts, made with care in small batches.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/styles.css">
  <script type="module" src="/assets/rum.js"></script>
</head>
<body data-page="home">
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="/" data-shop-name>Handmade Gifts</a>
      <a class="cart-link" href="/cart.html" aria-label="Cart">Cart <span class="cart-count" data-cart-count>0</span></a>
    </div>
  </header>
  <main class="wrap" id="main">
    <section class="hero">
      <h1>Gifts made slowly, by hand.</h1>
      <p>Small-batch pieces crafted one at a time. When something sells out, the next one is already on the workbench.</p>
    </section>
    <div id="status" role="status" aria-live="polite"></div>
    <section class="grid" data-testid="product-grid" id="grid" aria-label="Products">
      <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
    </section>
  </main>
  <footer class="site-footer">
    <div class="wrap">
      <span>&copy; <span data-year></span> <span data-shop-name>Handmade Gifts</span> · Every piece made by hand</span>
      <span>Secure checkout by Stripe</span>
    </div>
  </footer>
  <script type="module" src="/assets/app.js"></script>
</body>
</html>
